<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tapok shot frame</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  iframe { display: block; border: 0; position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<script>
/* Обёртка для точных скриншотов: кладём игру в iframe ровно заданного размера.
   ?w=430&h=880&src=<url-encoded> */
(function () {
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '430', 10);
  var h = parseInt(q.get('h') || '880', 10);
  var f = document.createElement('iframe');
  f.setAttribute('width', w);
  f.setAttribute('height', h);
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  f.src = q.get('src') || '../index.html';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
