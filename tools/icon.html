<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>tapok icon</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0e14; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="icon" width="512" height="512"></canvas>

<script src="../js/i18n.js"></script>
<script src="../js/weapons.js"></script>
<script src="../js/fx.js"></script>
<script src="../js/flies.js"></script>
<script>
/* Иконка для карточки игры: рисуется теми же функциями, что и сама игра,
   поэтому стиль совпадает автоматически. Без текста — иконка годится и для ru, и для en. */
(function () {
  'use strict';
  var T = window.TAPOK;
  var W = 512, H = 512;
  var ctx = document.getElementById('icon').getContext('2d');

  // --- фон: кухонная стена ---
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#33506f');
  g.addColorStop(0.55, '#22364c');
  g.addColorStop(1, '#141d29');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 3;
  for (var x = 0; x <= W; x += 128) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (var y = 0; y <= H; y += 128) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // --- стол ---
  var tableY = 402;
  ctx.fillStyle = '#6b4a2a';
  ctx.fillRect(0, tableY, W, H - tableY);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(0, tableY, W, 12);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.fillRect(0, tableY + 52, W, 6);

  // --- след удара: вмятина и брызги ---
  var hitX = 322, hitY = 322;
  T.fx.reset();
  T.fx.ring(hitX, hitY, 104, 'rgba(255,255,255,0.6)');
  T.fx.splat(hitX, hitY, '#7bb661', 20);
  T.fx.coinPop(hitX, hitY, 3);
  for (var s = 0; s < 12; s++) T.fx.update(1 / 60);

  // --- муха под тапком ---
  var fly = {
    type: 'fly', x: hitX - 10, y: hitY + 30, r: 58,
    color: '#54545f', ang: 2.2, seed: 1.7, flash: 0.12,
    state: 'fly', deadT: 0.2, hp: 0, maxHp: 1
  };
  T.fx.drawUnder(ctx);
  T.flies._drawFly(ctx, fly, 0.35);

  // --- две удирающие мухи: иконка читается как «тапок против мух» ---
  var fly2 = {
    type: 'fast', x: 432, y: 128, r: 40, color: '#6a6a7c',
    ang: -0.85, seed: 3.1, flash: 0, state: 'fly', deadT: 0, hp: 1, maxHp: 1
  };
  var fly3 = {
    type: 'fly', x: 82, y: 372, r: 34, color: '#54545f',
    ang: 1.25, seed: 5.4, flash: 0, state: 'fly', deadT: 0, hp: 1, maxHp: 1
  };
  T.flies._drawFly(ctx, fly2, 0.35);
  T.flies._drawFly(ctx, fly3, 0.35);

  // --- лучи удара ---
  ctx.save();
  ctx.translate(hitX, hitY);
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#ffd23f';
  for (var r = 0; r < 9; r++) {
    var a = r * (Math.PI * 2 / 9) + 0.3;
    var len = 70 + (r % 3) * 22;
    ctx.save();
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(0, -11);
    ctx.lineTo(len, 0);
    ctx.lineTo(0, 11);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // --- тапок в замахе ---
  ctx.save();
  ctx.translate(198, 162);
  ctx.rotate(2.42);
  ctx.scale(3.4, 3.4);
  T.weapons._slipper(ctx, '#c0392b');
  ctx.restore();

  // --- дуга замаха ---
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(186, 138, 146, 0.4, 1.25);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(186, 138, 176, 0.5, 1.0);
  ctx.globalAlpha = 0.5;
  ctx.stroke();
  ctx.restore();

  T.fx.drawOver(ctx);

  // --- виньетка для контраста ---
  var v = ctx.createRadialGradient(W / 2, H / 2, H * 0.34, W / 2, H / 2, H * 0.8);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.38)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
})();
</script>
</body>
</html>
